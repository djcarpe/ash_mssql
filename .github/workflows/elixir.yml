name: CI
on:
  push:
    tags:
      - "v*"
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  # Version-independent jobs (lint/docs/dialyzer/compiles) run exactly once.
  lint:
    uses: ./.github/workflows/ash-ci.yml
    with:
      tests: false
  # Only the test job is matrixed over SQL Server versions.
  test:
    strategy:
      fail-fast: false
      matrix:
        mssql-version: ["2022-latest", "2025-latest"]
    uses: ./.github/workflows/ash-ci.yml
    with:
      mssql: true
      mssql-version: ${{ matrix.mssql-version }}
      lint: false
  release:
    name: Release
    needs:
      - lint
      - test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: team-alembic/staple-actions/actions/mix-hex-publish@main
        with:
          mix-env: dev
          hex-api-key: ${{ secrets.HEX_API_KEY }}
