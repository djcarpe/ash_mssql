name: CI
on:
  push:
    tags:
      - "v*"
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  ash-ci:
    strategy:
      fail-fast: false
      matrix:
        mssql-version: ["8.0"]
    uses: ash-project/ash_mssql/.github/workflows/ash-ci.yml@main
    with:
      mssql: true
      mssql-version: ${{matrix.mssql-version}}
    secrets:
      hex_api_key: ${{ secrets.HEX_API_KEY }}
