name: Ash CI Checks
# Only called from elixir.yml in this repo. Every job here needs
# MIX_ENV=test compiled code, so the caller waits on its own build-test job
# (needs: build-test) before invoking this workflow — mix-compile calls
# below are cache hits. Dev-env jobs (docs/dialyzer) live in
# ash-ci-dev.yml, chained off build-dev instead.
on:
  workflow_call:
jobs:
  # Warnings-as-errors enforcement lives here, on a `mix clean`ed build,
  # instead of in mix.exs elixirc_options: recompiling over a restored build
  # cache emits benign "redefining module" warnings (Spark/Ash compile-time
  # hooks load stale beams mid-compile) that would otherwise hard-fail every
  # cache-skewed mix task. A clean compile is deterministic.
  compile-warnings:
    name: mix compile --warnings-as-errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: team-alembic/staple-actions/actions/mix-task@main
        with:
          mix-env: test
          task: do clean, compile --warnings-as-errors
  formatter:
    name: mix format --check-formatted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: team-alembic/staple-actions/actions/mix-format@main
        with:
          mix-env: test

  spark-formatter:
    name: mix spark.formatter --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: team-alembic/staple-actions/actions/mix-task@main
        with:
          mix-env: test
          task: spark.formatter --check

  spark-cheat-sheets:
    name: mix spark.cheat_sheets --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: team-alembic/staple-actions/actions/mix-task@main
        with:
          mix-env: test
          task: spark.cheat_sheets --check
  sobelow:
    name: mix sobelow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: team-alembic/staple-actions/actions/mix-task@main
        with:
          mix-env: test
          task: sobelow
  credo:
    name: mix credo --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: team-alembic/staple-actions/actions/mix-credo@main
        with:
          mix-env: test
  unused-deps:
    name: mix deps.unlock --check-unused
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: team-alembic/staple-actions/actions/mix-task@main
        with:
          mix-env: test
          task: deps.unlock --check-unused
