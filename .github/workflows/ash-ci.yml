name: Ash CI
on:
  workflow_call:
    inputs:
      # When false, only the deps/build/test jobs run — used to matrix the
      # test job over SQL Server versions without duplicating the
      # version-independent lint/docs/dialyzer jobs.
      lint:
        type: boolean
        default: true
      # When false, the test job is skipped — used for the lint-only
      # invocation so tests run exclusively in the matrixed test invocation.
      tests:
        type: boolean
        default: true
      spark-formatter:
        type: boolean
        default: true
      spark-cheat-sheets:
        type: boolean
        default: true
      sobelow:
        type: boolean
        default: true
      mssql:
        type: boolean
        default: false
      ash_mssql:
        type: boolean
        default: true
      ecto_mssql:
        type: boolean
        default: false
      mssql-version:
        type: string
        default: "2022-latest"
env:
  MSSQL_VERSION: ${{inputs.mssql-version}}
jobs:
  deps:
    name: mix deps.get
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: team-alembic/staple-actions/actions/mix-deps-get@main

  auditor:
    name: audit
    runs-on: ubuntu-latest
    needs: deps
    if: ${{inputs.lint}}
    steps:
      - uses: actions/checkout@v7
      - uses: team-alembic/staple-actions/actions/mix-hex-audit@main
      - uses: team-alembic/staple-actions/actions/mix-task@main
        with:
          task: deps.audit
  build-test:
    name: MIX_ENV=test mix.compile
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - uses: actions/checkout@v7
      - uses: team-alembic/staple-actions/actions/install-elixir@main
      - uses: team-alembic/staple-actions/actions/mix-compile@main
        with:
          mix-env: test
  build-docs:
    name: mix docs
    runs-on: ubuntu-latest
    needs: build-dev
    if: ${{inputs.lint}}
    steps:
      - uses: actions/checkout@v7
      - uses: team-alembic/staple-actions/actions/mix-docs@main
        with:
          mix-env: dev
          use-cache?: false
      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: doc/

  formatter:
    name: mix format --check-formatted
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{inputs.lint}}
    steps:
      - uses: actions/checkout@v7
      - uses: team-alembic/staple-actions/actions/mix-format@main
        with:
          mix-env: test

  spark-formatter:
    name: mix spark.formatter --check
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{inputs.lint}}
    steps:
      - uses: actions/checkout@v7
      - uses: team-alembic/staple-actions/actions/mix-task@main
        if: ${{inputs.spark-formatter}}
        with:
          mix-env: test
          task: spark.formatter --check

  spark-cheat-sheets:
    name: mix spark.cheat_sheets --check
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{inputs.lint}}
    steps:
      - uses: actions/checkout@v7
      - uses: team-alembic/staple-actions/actions/mix-task@main
        if: ${{inputs.spark-cheat-sheets}}
        with:
          mix-env: test
          task: spark.cheat_sheets --check
  sobelow:
    name: mix sobelow
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{inputs.lint}}
    steps:
      - uses: actions/checkout@v7
      - uses: team-alembic/staple-actions/actions/mix-task@main
        if: ${{inputs.sobelow}}
        with:
          mix-env: test
          task: sobelow
  credo:
    name: mix credo --strict
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{inputs.lint}}
    steps:
      - uses: actions/checkout@v7
      - uses: team-alembic/staple-actions/actions/mix-credo@main
        with:
          mix-env: test
  unused-deps:
    name: mix deps.unlock --check-unused
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{inputs.lint}}
    steps:
      - uses: actions/checkout@v7
      - uses: team-alembic/staple-actions/actions/mix-task@main
        with:
          mix-env: test
          task: deps.unlock --check-unused
  test:
    name: mix test
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{inputs.tests}}
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:${{inputs.mssql-version}}
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: YourStrong@Passw0rd
          MSSQL_PID: Developer
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P YourStrong@Passw0rd -Q 'SELECT 1' -b -o /dev/null"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v7
      - uses: team-alembic/staple-actions/actions/mix-task@main
        if: ${{inputs.mssql && inputs.ash_mssql}}
        with:
          mix-env: test
          task: ash_mssql.generate_migrations --check
      - uses: team-alembic/staple-actions/actions/mix-task@main
        with:
          mix-env: test
          task: ash_mssql.create
        if: ${{inputs.mssql && inputs.ash_mssql}}
      - uses: team-alembic/staple-actions/actions/mix-task@main
        with:
          mix-env: test
          task: ecto.create
        if: ${{inputs.mssql && inputs.ecto_mssql}}
      - uses: team-alembic/staple-actions/actions/mix-task@main
        with:
          mix-env: test
          task: ash_mssql.migrate
        if: ${{inputs.mssql && inputs.ash_mssql}}
      - uses: team-alembic/staple-actions/actions/mix-task@main
        with:
          mix-env: test
          task: ecto.migrate
        if: ${{inputs.mssql && inputs.ecto_mssql}}
      - uses: team-alembic/staple-actions/actions/mix-test@main
        with:
          mix-env: test

  dialyzer:
    name: mix dialyzer
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{inputs.lint}}
    steps:
      - uses: actions/checkout@v7
      - uses: team-alembic/staple-actions/actions/mix-dialyzer@main
        with:
          mix-env: dev

  build-dev:
    name: MIX_ENV=dev mix.compile
    runs-on: ubuntu-latest
    needs: deps
    if: ${{inputs.lint}}
    steps:
      - uses: actions/checkout@v7
      - uses: team-alembic/staple-actions/actions/mix-compile@main
        with:
          mix-env: dev
  # The hex release lives in the caller (elixir.yml): it must depend on both
  # the lint invocation and every matrix leg of the test invocation, which a
  # job inside a single workflow_call invocation cannot express.